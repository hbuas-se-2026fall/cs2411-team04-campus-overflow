# CampusOverflow 持续集成流水线
# 采用「渐进式质量门禁」（ADR-009）：按 Sprint 范围逐步扩大必须通过的测试集合。
# 改这个文件必须走 PR —— 教师会检查 ci.yml 的提交历史。
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

# 同一分支连续推送时，取消仍在运行的旧流水线（节省 Actions 分钟，组织每月仅 3000 分钟）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 当前 Sprint 内「必须全绿」的模块（逗号分隔，Maven -pl 语法）。
  # 每个 Sprint 计划会后更新一次，只增不减，直到 S3 恢复全量。
  #   S0: co-shared-kernel,co-identity/co-identity-domain
  #   S1: 追加 co-qa/co-qa-domain,co-qa/co-qa-application
  #   S2: 追加 co-reputation/co-reputation-domain,co-reputation/co-reputation-application
  #   S3: 删除本变量，恢复全量 mvn test / verify
  SPRINT_MODULES: co-shared-kernel,co-identity/co-identity-domain

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 1：编译（27 个模块必须始终可编译，模块依赖不成环由 Maven 保证）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段 2：单元测试（只跑当前 Sprint 范围，未实现模块的断言不拦）
      - name: 单元测试（Sprint 范围）
        run: mvn -B -f backend/pom.xml test -pl "$SPRINT_MODULES" -am

      # 阶段 3：架构适应度函数（ArchUnit FF-1~FF-6，必须始终通过）
      - name: 架构约束检查
        run: >
          mvn -B -f backend/pom.xml test
          -pl co-bootstrap -am
          -Dtest=ArchitectureTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -DfailIfNoTests=false

      # 阶段 4：覆盖率门禁（domain.coverage.minimum，S0 为 0，逐 Sprint 提高）
      - name: 覆盖率门禁（Sprint 范围）
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false -pl "$SPRINT_MODULES" -am

      # 阶段 5：集成测试（Testcontainers 拉起 MySQL + Redis）
      # S0~S2 允许失败（业务尚未实现完）；S3 起删除 continue-on-error 改为硬门禁
      - name: 集成测试（S0-S2 允许失败）
        if: github.event_name == 'push'
        continue-on-error: true
        run: mvn -B -f backend/pom.xml verify -Dsurefire.skip=true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"
          if-no-files-found: ignore

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # 只在推送到 main（发布）时构建镜像，节省 Actions 分钟
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .
